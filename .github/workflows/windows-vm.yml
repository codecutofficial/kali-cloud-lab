name: Windows VM (Guacamole HTML5 via Cloudflare)

# Hosted exactly like the Kali lab: Docker containers on a Linux runner, published by a
# Cloudflare quick tunnel. NO noVNC anywhere.
#
#   dockur/windows  ->  a real Windows VM (KVM-accelerated QEMU), speaking RDP
#   guacd           ->  Apache Guacamole's RDP proxy
#   guacamole       ->  renders that RDP session as HTML5 in the browser  (port 8080)
#   cloudflared     ->  makes it public
#
# Guacamole streams RDP, not VNC — so it is far more responsive than a VNC bridge,
# auto-fits the resolution to your browser window, and doesn't drop the session.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Windows edition to install."
        type: choice
        default: "11l"
        options: [ "11l", "11", "10l", "10", "2022", "2025", "tiny11" ]
      ram:
        description: "RAM for the VM."
        type: string
        default: "8G"
      cores:
        description: "CPU cores for the VM."
        type: string
        default: "4"

permissions:
  contents: read

concurrency:
  group: windows-vm
  cancel-in-progress: true

jobs:
  windows-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VERSION: ${{ inputs.version }}
      RAM_SIZE: ${{ inputs.ram }}
      CPU_CORES: ${{ inputs.cores }}
    steps:
      - name: Free disk space and enable KVM
        run: |
          set -euo pipefail
          # The VM disk + ISO go on /mnt, which is much roomier than / on a runner.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo mkdir -p /mnt/winstorage && sudo chmod 777 /mnt/winstorage
          df -h / /mnt

          # Standard GitHub-runner incantation to make /dev/kvm usable.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || { echo "::error::No /dev/kvm — this runner can't do hardware virtualization."; exit 1; }
          echo "KVM is available."

      - name: Generate credentials
        run: |
          set -euo pipefail
          {
            echo "WINPASS=$(openssl rand -hex 6)"
            echo "GUACPASS=$(openssl rand -hex 6)"
            echo "DBPASS=$(openssl rand -hex 12)"
          } >> "$GITHUB_ENV"

      - name: Start Guacamole stack (postgres + guacd + web app)
        run: |
          set -euo pipefail
          docker network create guac

          docker run -d --name guacdb --network guac \
            -e POSTGRES_DB=guacamole_db \
            -e POSTGRES_USER=guacamole \
            -e POSTGRES_PASSWORD="$DBPASS" \
            postgres:15-alpine

          echo "Waiting for postgres..."
          for i in $(seq 1 60); do
            docker exec guacdb pg_isready -U guacamole -d guacamole_db >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec guacdb pg_isready -U guacamole -d guacamole_db

          # Load Guacamole's schema (generated by the image itself, so it always matches).
          docker run --rm guacamole/guacamole /opt/guacamole/bin/initdb.sh --postgresql > /tmp/initdb.sql
          docker exec -i guacdb psql -q -U guacamole -d guacamole_db < /tmp/initdb.sql
          echo "Guacamole schema loaded."

          docker run -d --name guacd --network guac guacamole/guacd

          # Both POSTGRES_* and POSTGRESQL_* are set: the variable names changed between
          # image versions and the unused pair is simply ignored.
          docker run -d --name guacamole --network guac \
            -e GUACD_HOSTNAME=guacd \
            -e POSTGRES_HOSTNAME=guacdb -e POSTGRESQL_HOSTNAME=guacdb \
            -e POSTGRES_DATABASE=guacamole_db -e POSTGRESQL_DATABASE=guacamole_db \
            -e POSTGRES_USER=guacamole -e POSTGRESQL_USER=guacamole \
            -e POSTGRES_PASSWORD="$DBPASS" -e POSTGRESQL_PASSWORD="$DBPASS" \
            -e WEBAPP_CONTEXT=ROOT \
            -p 8080:8080 guacamole/guacamole

          echo "Waiting for the Guacamole web app..."
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            [ "$code" = "200" ] && { echo "Guacamole is up."; break; }
            sleep 2
          done
          if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)" != "200" ]; then
            echo "::error::Guacamole did not come up."; docker logs --tail 100 guacamole; exit 1
          fi

      - name: Check out the OEM tuning scripts
        uses: actions/checkout@v4

      - name: Start the Windows VM
        run: |
          set -euo pipefail

          # dockur runs /storage/oem/install.bat inside the VM during the unattended
          # install — that's where the redraw/performance tuning gets baked in.
          mkdir -p /mnt/winstorage/oem
          cp windows/install.bat /mnt/winstorage/oem/install.bat
          ls -l /mnt/winstorage/oem/

          docker run -d --name windows --network guac \
            -e VERSION="$VERSION" \
            -e RAM_SIZE="$RAM_SIZE" \
            -e CPU_CORES="$CPU_CORES" \
            -e DISK_SIZE=32G \
            -e USERNAME=Docker \
            -e PASSWORD="$WINPASS" \
            --device=/dev/kvm --device=/dev/net/tun --cap-add NET_ADMIN \
            -p 8006:8006 -p 3389:3389/tcp -p 3389:3389/udp \
            -v /mnt/winstorage:/storage \
            --stop-timeout 120 \
            dockurr/windows
          sleep 10
          docker logs --tail 30 windows || true
          echo "Windows is installing — this is unattended and takes a while."

      - name: Register the Windows desktop in Guacamole
        run: |
          set -euo pipefail
          # Seed the RDP connection and re-key the guacadmin account, so the box is not
          # sitting behind the well-known default password on a public URL.
          cat > /tmp/seed.sql <<SQL
          CREATE EXTENSION IF NOT EXISTS pgcrypto;

          WITH c AS (
            INSERT INTO guacamole_connection (connection_name, protocol)
            VALUES ('Windows', 'rdp')
            RETURNING connection_id
          ), params AS (
            INSERT INTO guacamole_connection_parameter (connection_id, parameter_name, parameter_value)
            SELECT c.connection_id, t.k, t.v FROM c, (VALUES
              ('hostname','windows'),
              ('port','3389'),
              ('username','Docker'),
              ('password','${WINPASS}'),
              ('security','any'),
              ('ignore-cert','true'),
              -- Fit the session to whatever the browser window is.
              ('resize-method','display-update'),
              ('color-depth','16'),
              -- Bitmap caching + compression: the single biggest win over a tunnel.
              ('enable-bitmap-caching','true'),
              ('enable-offscreen-caching','true'),
              ('disable-bitmap-caching','false'),
              ('compression-level','2'),
              ('enable-gfx','true'),
              ('force-lossless','false'),
              ('enable-desktop-composition','true'),
              ('enable-remote-app','false'),
              ('disable-glyph-caching','false'),
              ('disable-offscreen-caching','false'),
              -- Strip the heavy desktop effects; each one is redraw cost we pay per frame.
              ('enable-wallpaper','false'),
              ('enable-theming','false'),
              ('enable-font-smoothing','false'),
              ('enable-full-window-drag','false'),
              ('enable-menu-animations','false'),
              ('server-layout','en-us-qwerty')
            ) AS t(k,v)
          )
          INSERT INTO guacamole_connection_permission (entity_id, connection_id, permission)
          SELECT e.entity_id, c.connection_id, 'READ'::guacamole_object_permission_type
          FROM c, guacamole_entity e
          WHERE e.name = 'guacadmin' AND e.type = 'USER';
          SQL
          docker exec -i guacdb psql -q -v ON_ERROR_STOP=1 -U guacamole -d guacamole_db < /tmp/seed.sql

          # Re-key guacadmin through Guacamole's OWN REST API rather than writing a hash
          # in SQL — its salt+hash scheme has changed across releases, so letting the app
          # compute it is the only reliable way.
          #
          # The token is sent BOTH as a Guacamole-Token header (1.6+) and as a ?token=
          # query parameter (1.5 and earlier), because the image is :latest and the
          # mechanism changed between them. Nothing here is silenced: an earlier version
          # of this discarded the response and left the box on the default password.
          echo "Re-keying the guacadmin account..."
          TOK_BODY=$(curl -s -w '\n%{http_code}' -d "username=guacadmin&password=guacadmin" \
            http://localhost:8080/api/tokens || true)
          TOK_CODE=$(echo "$TOK_BODY" | tail -1)
          TOKEN=$(echo "$TOK_BODY" | head -n -1 | grep -oE '"authToken":"[^"]+' | sed 's/.*:"//' || true)
          echo "  POST /api/tokens -> HTTP ${TOK_CODE}, token $([ -n "$TOKEN" ] && echo "received" || echo "MISSING")"

          if [ -n "$TOKEN" ]; then
            PW_URL="http://localhost:8080/api/session/data/postgresql/users/guacadmin/password"
            BODY="{\"oldPassword\":\"guacadmin\",\"newPassword\":\"${GUACPASS}\"}"
            for attempt in header query; do
              if [ "$attempt" = "header" ]; then
                CODE=$(curl -s -o /tmp/pw.out -w '%{http_code}' -X PUT \
                  -H "Content-Type: application/json" -H "Guacamole-Token: ${TOKEN}" \
                  -d "$BODY" "$PW_URL" || true)
              else
                CODE=$(curl -s -o /tmp/pw.out -w '%{http_code}' -X PUT \
                  -H "Content-Type: application/json" \
                  -d "$BODY" "${PW_URL}?token=${TOKEN}" || true)
              fi
              echo "  PUT password (${attempt}) -> HTTP ${CODE}"
              case "$CODE" in
                2*) echo "  accepted."; break ;;
                *)  sed -e "s/${GUACPASS}/<redacted>/g" /tmp/pw.out 2>/dev/null | head -3 || true ;;
              esac
            done
          fi

          # Prove the new password works; never just assume it.
          if curl -s -f -d "username=guacadmin&password=${GUACPASS}" \
                  http://localhost:8080/api/tokens | grep -q authToken; then
            echo "guacadmin re-keyed and verified."
            echo "GUAC_DEFAULT=0" >> "$GITHUB_ENV"
          else
            echo "::warning title=Guacamole password is STILL THE DEFAULT::The browser route is open to anyone with the link. Change it in Settings -> Preferences, or just use the RDP route."
            echo "GUACPASS=guacadmin" >> "$GITHUB_ENV"
            echo "GUAC_DEFAULT=1" >> "$GITHUB_ENV"
            docker logs --tail 20 guacamole 2>&1 | tail -20 || true
          fi

      # cloudflared and the hold-open loop MUST share a step: the runner tears down a
      # step's process tree the moment that step ends.
      - name: Publish the public link and hold it open
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -uo pipefail
          sudo wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

          tunnel_url () {   # $1 = log file
            for i in $(seq 1 45); do
              u=$(grep -oE "https://[a-z0-9-]+\.trycloudflare\.com" "$1" 2>/dev/null | head -1 || true)
              [ -n "$u" ] && { echo "$u"; return; }
              sleep 2
            done
          }

          cloudflared tunnel --no-autoupdate --url http://localhost:8080 > /tmp/cf-web.log 2>&1 &
          CF_PID=$!
          URL=$(tunnel_url /tmp/cf-web.log)

          cloudflared tunnel --no-autoupdate --url http://localhost:8006 > /tmp/cf-inst.log 2>&1 &
          INST_PID=$!
          INST=$(tunnel_url /tmp/cf-inst.log)

          # ------------------------------------------------------------------
          # Native RDP. A real RDP client skips Guacamole's decode/re-encode
          # entirely, negotiates the exact window size, and caches bitmaps
          # locally — far smoother than anything the browser can do.
          #
          # The runner sits behind Azure NAT with no inbound-reachable IP, so
          # it cannot be dialed directly; something has to dial OUT and relay.
          # Two ways, and we set up whichever is available:
          #
          #   bore      - zero setup. Public relay, random port each run.
          #   Tailscale - needs a TS_AUTHKEY secret, but gives a FIXED
          #               hostname that never changes between runs.
          # ------------------------------------------------------------------
          RDP_HOST=""
          TS_HOST=""

          # --- bore: no account, no card, nothing installed locally ---------
          BORE_VER=0.6.0
          curl -sSL "https://github.com/ekzhang/bore/releases/download/v${BORE_VER}/bore-v${BORE_VER}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar xz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/bore

          # Writes the pid to a FILE, not a variable: this runs inside $( ), which is a
          # subshell, so any variable it sets would be lost when that subshell exits.
          start_bore () {
            bore local 3389 --to bore.pub > /tmp/bore.log 2>&1 &
            echo $! > /tmp/bore.pid
            for i in $(seq 1 20); do
              p=$(grep -oE 'remote_port[=:" ]*[0-9]+' /tmp/bore.log 2>/dev/null | grep -oE '[0-9]+' | head -1 || true)
              [ -z "$p" ] && p=$(grep -oE 'bore\.pub:[0-9]+' /tmp/bore.log 2>/dev/null | grep -oE '[0-9]+$' | head -1 || true)
              [ -n "$p" ] && { echo "$p"; return; }
              sleep 1
            done
          }
          BORE_PORT=$(start_bore)
          BORE_PID=$(cat /tmp/bore.pid 2>/dev/null || true)
          if [ -n "$BORE_PORT" ]; then
            RDP_HOST="bore.pub:${BORE_PORT}"
            echo "Native RDP endpoint: $RDP_HOST"
          else
            echo "::warning::bore did not report a port."; tail -20 /tmp/bore.log || true
          fi

          # --- Tailscale: optional, but the address never changes ------------
          if [ -n "${TS_AUTHKEY:-}" ]; then
            curl -fsSL https://tailscale.com/install.sh | sh > /dev/null 2>&1
            sudo tailscale up --authkey="$TS_AUTHKEY" --hostname=winlab --accept-routes \
              > /tmp/ts.log 2>&1 || { echo "::warning::tailscale up failed"; tail -5 /tmp/ts.log || true; }
            # Read back the name Tailscale actually assigned — if a previous run's
            # node is still registered, this one becomes winlab-1, winlab-2, ...
            TS_HOST=$(sudo tailscale status --json 2>/dev/null | jq -r '.Self.DNSName // empty' | sed 's/\.$//' || true)
            [ -n "$TS_HOST" ] && echo "Tailscale name: ${TS_HOST}"
          fi

          {
            echo "# 🪟 Windows VM"
            echo ""
            echo "Windows is installing (unattended, typically **15–30 min**)."
            echo "The Summary adds a **✅ ready** line below when the desktop actually answers."
            echo ""
            echo "## ⚡ Remote Desktop — paste into \`mstsc\`, NOT a browser"
            echo ""
            if [ -n "$TS_HOST" ]; then
              echo "\`\`\`"
              echo "${TS_HOST}:3389"
              echo "\`\`\`"
              echo ""
              echo "(Tailscale — this address is the same every run.)"
              echo ""
            fi
            if [ -n "$RDP_HOST" ]; then
              echo "\`\`\`"
              echo "${RDP_HOST}"
              echo "\`\`\`"
              echo ""
              echo "(bore — nothing to install, but **the port changes every run**, so copy it fresh.)"
              echo ""
            fi
            if [ -z "$TS_HOST" ] && [ -z "$RDP_HOST" ]; then
              echo "_No RDP endpoint came up — use the browser route below._"
              echo ""
            fi
            echo "Sign in as \`Docker\` / \`${WINPASS}\`. Full-speed RDP, sized to your window."
            echo ""
            echo "> Windows key → type \`mstsc\` → Enter → paste the address above into **Computer**."
            echo "> It is \`host:port\` — **not** an \`https://\` link. Pasting a \`trycloudflare.com\`"
            echo "> URL here gives \"The remote computer name is not valid\"."
            echo ""
            echo "---"
            echo ""
            echo "## 🐢 Browser desktop — paste into a BROWSER, not mstsc"
            echo ""
            echo "${URL}"
            echo ""
            echo "- Guacamole login: \`guacadmin\` / \`${GUACPASS}\`"
            echo ""
            if [ "${GUAC_DEFAULT:-0}" = "1" ]; then
              echo "> ⚠️ **That is Guacamole's default password** — the re-key failed, so anyone"
              echo "> with the link above can open this desktop. Either change it (sign in →"
              echo "> **guacadmin** top-right → **Settings → Preferences**) or ignore the browser"
              echo "> route and use RDP, which has its own random password."
              echo ""
            fi
            echo "_This route re-encodes every frame, so it is the slower option._"
            echo ""
            echo "Watch the install: ${INST}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Install progress::${INST}"
          [ -n "$RDP_HOST" ] && echo "::notice title=RDP for mstsc (ready after install)::${RDP_HOST}  Docker/${WINPASS}"
          [ -n "$TS_HOST" ] && echo "::notice title=RDP via Tailscale (stable)::${TS_HOST}:3389  Docker/${WINPASS}"
          echo "::notice title=Browser desktop (ready after install)::${URL}  guacadmin/${GUACPASS}"

          # Wait for Windows to finish installing and actually serve RDP.
          #
          # A plain TCP connect is NOT enough: QEMU's user-mode networking accepts the
          # connection on the host side long before Windows is listening inside the guest,
          # so port 3389 "answers" throughout the install. Connecting then hangs at
          # "Configuring remote session" and fails.
          #
          # So speak RDP instead: send an X.224 Connection Request and require a
          # Connection Confirm (0xD0) back. Only the guest's own RDP stack can produce that.
          echo "Waiting for Windows to answer a real RDP handshake..."
          cat > /tmp/rdp_probe.py <<'PY'
          import socket, sys
          # TPKT header + X.224 Connection Request + RDP_NEG_REQ (TLS | CredSSP)
          req = bytes.fromhex("030000130ee000000000000100080003000000")
          try:
              s = socket.create_connection(("127.0.0.1", 3389), timeout=5)
              s.sendall(req)
              r = s.recv(19)
              s.close()
          except Exception:
              sys.exit(1)
          # Need a TPKT reply whose X.224 code is Connection Confirm.
          sys.exit(0 if len(r) >= 6 and r[0] == 3 and r[5] == 0xD0 else 1)
          PY
          READY=0
          for i in $(seq 1 300); do   # up to ~50 min
            if python3 /tmp/rdp_probe.py 2>/dev/null; then
              echo "RDP handshake succeeded — Windows is genuinely ready."; READY=1; break
            fi
            if [ $((i % 30)) -eq 0 ]; then echo "  ...still installing ($((i/6)) min)"; docker logs --tail 5 windows 2>&1 || true; fi
            sleep 10
          done

          if [ "$READY" = "1" ]; then
            sleep 30   # let the first-boot desktop settle before anyone connects
            {
              echo "---"
              echo "## ✅ Windows finished installing — the desktop is live"
              echo ""
              echo "### ⚡ Remote Desktop (recommended) — for \`mstsc\`"
              echo ""
              [ -n "$TS_HOST" ] && { echo "\`\`\`"; echo "${TS_HOST}:3389"; echo "\`\`\`"; echo ""; }
              [ -n "$RDP_HOST" ] && { echo "\`\`\`"; echo "${RDP_HOST}"; echo "\`\`\`"; echo ""; }
              echo "Sign in as \`Docker\` / \`${WINPASS}\`."
              echo ""
              echo "### Browser fallback — for a browser"
              echo ""
              echo "${URL}"
              echo ""
              echo "Sign in with \`guacadmin\` / \`${GUACPASS}\`, then click **Windows**."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Windows is READY::${TS_HOST:+${TS_HOST}:3389 }${RDP_HOST:-$URL}"
          else
            echo "::warning::Windows never answered RDP. Recent VM logs:"
            docker logs --tail 60 windows || true
          fi

          echo "=================================================="
          echo " RDP (mstsc) : ${RDP_HOST:-<none>}   (Docker / ${WINPASS})"
          [ -n "$TS_HOST" ] && \
          echo " RDP (stable): ${TS_HOST}:3389   (Docker / ${WINPASS})"
          echo " BROWSER     : ${URL}   (guacadmin / ${GUACPASS})"
          echo "=================================================="

          # Leave the tailnet on the way out, so the next run gets the plain
          # 'winlab' name again instead of winlab-1, winlab-2, ...
          trap '[ -n "${TS_AUTHKEY:-}" ] && sudo tailscale logout >/dev/null 2>&1 || true' EXIT

          # Hold the job open so the desktop stays reachable (under the 6h cap).
          END=$((SECONDS + 20400))
          BORE_REVIVES=0
          while [ $SECONDS -lt $END ]; do
            if ! kill -0 "$CF_PID" 2>/dev/null; then echo "cloudflared exited:"; cat /tmp/cf-web.log; exit 1; fi
            # bore.pub is a community relay; if it drops the tunnel, reconnect.
            # The port is NOT preserved across a reconnect, so shout about the new one.
            if [ -n "${BORE_PID:-}" ] && ! kill -0 "$BORE_PID" 2>/dev/null; then
              if [ "$BORE_REVIVES" -lt 10 ]; then
                BORE_REVIVES=$((BORE_REVIVES + 1))
                NEWPORT=$(start_bore)
                BORE_PID=$(cat /tmp/bore.pid 2>/dev/null || true)
                if [ -n "$NEWPORT" ]; then
                  RDP_HOST="bore.pub:${NEWPORT}"
                  echo "::warning title=bore reconnected — NEW RDP address::${RDP_HOST} (revive ${BORE_REVIVES})"
                  { echo ""; echo "> ⚠️ bore reconnected. New RDP address: \`${RDP_HOST}\`"; } >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "::warning::bore died and would not come back; use the browser route."
                  BORE_PID=""
                fi
              else
                echo "::warning::bore keeps dropping; giving up on it. Browser route still works."
                BORE_PID=""
              fi
            fi
            sleep 15
          done
          echo "Reached time limit; shutting down."
