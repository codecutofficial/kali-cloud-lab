name: Windows VM (Tailscale RDP)

# A real Windows VM on a GitHub Actions runner, accessible ONLY through Tailscale.
# Nothing is exposed to the public internet — no bore, no Cloudflare, no Guacamole.
#
#   dockur/windows  ->  a real Windows VM (KVM-accelerated QEMU), speaking RDP
#   Tailscale       ->  private WireGuard mesh, fixed address every run
#
# Requires a TS_AUTHKEY repo secret. Without it the run fails immediately.
# SECURITY: No credentials, IPs, or hostnames are printed to logs or summary.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Windows edition to install."
        type: choice
        default: "11l"
        options: [ "11l", "11", "10l", "10", "2022", "2025", "tiny11" ]
      ram:
        description: "RAM for the VM. The runner has 16G total."
        type: string
        default: "12G"
      cores:
        description: "CPU cores for the VM. The runner has 4."
        type: string
        default: "3"

permissions:
  contents: read

concurrency:
  group: windows-vm
  cancel-in-progress: true

jobs:
  windows-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VERSION: ${{ inputs.version }}
      RAM_SIZE: ${{ inputs.ram }}
      CPU_CORES: ${{ inputs.cores }}
    steps:
      - name: Free disk space and enable KVM
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo mkdir -p /mnt/winstorage && sudo chmod 777 /mnt/winstorage
          df -h / /mnt

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || { echo "::error::No /dev/kvm — this runner can't do hardware virtualization."; exit 1; }
          echo "KVM is available."

      - name: Verify Tailscale secret exists
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          if [ -z "${TS_AUTHKEY:-}" ]; then
            echo "::error::TS_AUTHKEY secret is not set. This workflow requires Tailscale."
            echo "::error::Go to repo Settings → Secrets → Actions → New repository secret → name it TS_AUTHKEY."
            echo "::error::Get a key from https://login.tailscale.com/admin/settings/keys (Ephemeral + Reusable)."
            exit 1
          fi
          echo "TS_AUTHKEY is set."

      - name: Generate credentials
        env:
          YT_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          WINPASS=$(openssl rand -hex 6)
          echo "WINPASS=$WINPASS" >> "$GITHUB_ENV"
          echo "::add-mask::$WINPASS"
          # Pass YouTube API key to later steps (masked)
          if [ -n "${YT_API_KEY:-}" ]; then
            echo "YT_API_KEY=$YT_API_KEY" >> "$GITHUB_ENV"
            echo "::add-mask::$YT_API_KEY"
          fi

      - name: Check out the OEM tuning scripts
        uses: actions/checkout@v4

      - name: Download Mesa3D software GPU
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq p7zip-full > /dev/null 2>&1
          MESA_VER="24.3.2"
          curl -fsSL -o /tmp/mesa.7z \
            "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VER}/mesa3d-${MESA_VER}-release-msvc.7z" || {
            echo "::warning::Mesa3D download failed — WARP software DirectX will still work"
            exit 0
          }
          mkdir -p /mnt/winstorage/mesa3d
          7z x /tmp/mesa.7z -o/mnt/winstorage/mesa3d -y > /dev/null 2>&1
          echo "Mesa3D ${MESA_VER} ready on shared storage"

      - name: Start the Windows VM
        run: |
          set -euo pipefail
          mkdir -p /mnt/winstorage/oem
          cp windows/install.bat /mnt/winstorage/oem/install.bat
          cp windows/bootstrap.ps1 /mnt/winstorage/oem/bootstrap.ps1

          # Copy the YouTube chat bot to shared storage
          mkdir -p /mnt/winstorage/youtube-bot
          cp youtube-bot/*.py youtube-bot/requirements.txt /mnt/winstorage/youtube-bot/

          # Write password to shared storage (VM reads it from multiple paths)
          echo "$WINPASS" > /mnt/winstorage/credentials.txt
          echo "$WINPASS" > /mnt/winstorage/oem/credentials.txt
          chmod 600 /mnt/winstorage/credentials.txt /mnt/winstorage/oem/credentials.txt

          # Write YouTube API key if set
          if [ -n "${YT_API_KEY:-}" ]; then
            echo "$YT_API_KEY" > /mnt/winstorage/youtube_api_key.txt
            chmod 600 /mnt/winstorage/youtube_api_key.txt
          fi

          docker run -d --name windows \
            -e VERSION="$VERSION" \
            -e RAM_SIZE="$RAM_SIZE" \
            -e CPU_CORES="$CPU_CORES" \
            -e DISK_SIZE=256G \
            -e GPU=Y \
            -e VRAM_SIZE=1G \
            -e VGA=qxl \
            -e USERNAME=Docker \
            -e PASSWORD="$WINPASS" \
            --device=/dev/kvm --device=/dev/net/tun --cap-add NET_ADMIN \
            -p 8006:8006 -p 3389:3389/tcp -p 3389:3389/udp \
            -v /mnt/winstorage:/storage \
            --stop-timeout 120 \
            dockurr/windows
          sleep 10
          docker logs --tail 30 windows 2>&1 | grep -v -i 'password' || true
          echo "Windows is installing — this is unattended and takes a while."

      - name: Connect Tailscale and hold the session open
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -uo pipefail

          # --- Join the tailnet --------------------------------------------------
          curl -fsSL https://tailscale.com/install.sh | sh > /dev/null 2>&1
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname=winlab --accept-routes \
            > /tmp/ts.log 2>&1 || { echo "::error::tailscale up failed"; exit 1; }

          TS_HOST=$(sudo tailscale status --json 2>/dev/null | jq -r '.Self.DNSName // empty' | sed 's/\.$//' || true)
          if [ -z "$TS_HOST" ]; then
            echo "::error::Tailscale joined but could not read the hostname."
            exit 1
          fi

          # Mask the Tailscale hostname so it never leaks to public logs
          echo "::add-mask::$TS_HOST"

          # Also mask the Tailscale IP
          TS_IP=$(sudo tailscale ip -4 2>/dev/null || true)
          if [ -n "$TS_IP" ]; then
            echo "::add-mask::$TS_IP"
          fi

          echo "Tailscale connected."

          # --- Write safe Summary (NO credentials, NO IPs) ----------------------
          {
            echo "# Windows VM (private — Tailscale only)"
            echo ""
            echo "Windows is installing (unattended, typically **15-30 min**)."
            echo "A **ready** line appears below when the desktop is live."
            echo ""
            echo "## How to connect"
            echo ""
            echo '```'
            echo "winlab:3389"
            echo '```'
            echo ""
            echo "- Open \`mstsc\` and connect to \`winlab\`"
            echo "- Username: \`Docker\`"
            echo "- Password: check \`C:\\credentials.txt\` on the VM desktop"
            echo "  (or open \`http://winlab:8006\` in your browser to see it)"
            echo ""
            echo "> **Private**: only devices on your Tailscale network can reach it."
            echo "> Nothing is exposed to the public internet."
            echo "> No credentials are shown in these logs."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # NO ::notice:: with credentials — those show in the public sidebar
          echo "::notice title=Windows VM::Tailscale connected. Use 'winlab' to connect via RDP."

          # --- Wait for Windows to finish installing ----------------------------
          echo "Waiting for Windows to answer a real RDP handshake..."
          cat > /tmp/rdp_probe.py <<'PY'
          import socket, sys
          req = bytes.fromhex("030000130ee000000000000100080003000000")
          try:
              s = socket.create_connection(("127.0.0.1", 3389), timeout=5)
              s.sendall(req)
              r = s.recv(19)
              s.close()
          except Exception:
              sys.exit(1)
          sys.exit(0 if len(r) >= 6 and r[0] == 3 and r[5] == 0xD0 else 1)
          PY
          READY=0
          for i in $(seq 1 300); do
            if python3 /tmp/rdp_probe.py 2>/dev/null; then
              echo "RDP handshake succeeded — Windows is genuinely ready."; READY=1; break
            fi
            if [ $((i % 30)) -eq 0 ]; then
              echo "  ...still installing ($((i/6)) min)"
              docker logs --tail 5 windows 2>&1 | grep -v -i 'password' || true
            fi
            sleep 10
          done

          if [ "$READY" = "1" ]; then
            sleep 30
            {
              echo "---"
              echo "## Windows is ready"
              echo ""
              echo "Connect via RDP to \`winlab:3389\` from any device on your Tailscale network."
              echo ""
              echo "- Username: \`Docker\`"
              echo "- Password: saved on the VM at \`C:\\credentials.txt\`"
              echo "  and on the Desktop as \`README.txt\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Windows is READY::Connect via Tailscale RDP to winlab"
          else
            echo "::warning::Windows never answered RDP. Recent VM logs:"
            docker logs --tail 60 windows 2>&1 | grep -v -i 'password' || true
          fi

          echo "Windows VM is running."

          trap 'sudo tailscale logout >/dev/null 2>&1 || true' EXIT

          # --- Hold the job open, check bootstrap status -------------------------
          END=$((SECONDS + 20400))
          BOOTSTRAP_NOTIFIED=0
          while [ $SECONDS -lt $END ]; do
            # Verify Tailscale is still connected.
            if ! sudo tailscale status > /dev/null 2>&1; then
              echo "Tailscale disconnected. Attempting reconnect..."
              sudo tailscale up --authkey="$TS_AUTHKEY" --hostname=winlab --accept-routes \
                > /tmp/ts.log 2>&1 || true
            fi

            # Check if bootstrap (Python, OBS, Chrome, Parsec) finished
            if [ "$BOOTSTRAP_NOTIFIED" = "0" ] && [ -f /mnt/winstorage/bootstrap-done.marker ]; then
              BOOTSTRAP_NOTIFIED=1
              echo "Bootstrap complete — all software installed."
              {
                echo ""
                echo "---"
                echo "## Setup Complete"
                echo ""
                echo "All software installed successfully:"
                echo "- Python 3.13 + YouTube Bot + TTS"
                echo "- OBS Studio"
                echo "- Google Chrome"
                echo "- Parsec"
                echo ""
                echo "The VM is fully ready to use."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::notice title=Setup Complete::All software installed (Python, OBS, Chrome, Parsec, YouTube bot)"
            fi

            sleep 15
          done
          echo "Reached time limit; shutting down."
