name: Kali Linux GUI (LinuxServer desktop via Cloudflare)

# Runs the maintained LinuxServer.io Kali desktop image (a full KDE desktop WITH a
# taskbar, served in the browser over KasmVNC/Selkies on port 3000) and exposes it
# through a Cloudflare quick tunnel (no account, no secrets). The public https link
# and the web login land in the run's SUMMARY tab. The desktop startup is handled by
# the image itself, so there is no fragile X/panel bring-up here.
on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - '.github/workflows/kali-gui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kali-gui
  cancel-in-progress: true

jobs:
  kali-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Start Kali desktop container
        run: |
          set -uo pipefail
          WEBPASS=$(openssl rand -hex 5)
          echo "WEBPASS=$WEBPASS" >> "$GITHUB_ENV"
          docker run -d --name kali \
            -e PUID=1000 -e PGID=1000 -e TZ=Etc/UTC \
            -e CUSTOM_USER=kali -e PASSWORD="$WEBPASS" \
            -e TITLE="Kali Cloud Lab" \
            --shm-size=1gb --security-opt seccomp=unconfined \
            -p 3000:3000 \
            lscr.io/linuxserver/kali-linux:latest

      - name: Wait for the desktop to come up
        run: |
          set -uo pipefail
          echo "First boot pulls a multi-GB image and starts a full desktop — this can take several minutes."
          for i in $(seq 1 150); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ 2>/dev/null || true)
            if [ "$code" = "200" ] || [ "$code" = "401" ]; then
              echo "Web desktop is up (HTTP $code)"
              docker exec kali sh -c "grep PRETTY_NAME /etc/os-release" 2>/dev/null || true
              exit 0
            fi
            sleep 10
          done
          echo "Desktop did not respond in time. Recent container logs:"
          docker logs --tail 150 kali || true
          exit 1

      - name: Public link (Cloudflare) — LINK IS IN THE SUMMARY TAB
        run: |
          set -uo pipefail
          sudo wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared tunnel --no-autoupdate --url http://localhost:3000 > /tmp/cf.log 2>&1 &
          CF_PID=$!
          URL=""
          for i in $(seq 1 45); do
            URL=$(grep -oE "https://[a-z0-9-]+\.trycloudflare\.com" /tmp/cf.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          {
            echo "# 🐉 Kali Linux desktop is live"
            echo ""
            if [ -n "$URL" ]; then
              echo "## Open in any browser:"
              echo ""
              echo "# ${URL}"
              echo ""
              echo "Log in when the browser prompts:"
              echo ""
              echo "- user: \`kali\`"
              echo "- password: \`${WEBPASS}\`"
            else
              echo "⚠️ Tunnel URL didn't appear. cloudflared log:"; echo '```'; cat /tmp/cf.log || true; echo '```'
            fi
            echo ""
            echo "---"
            echo "_Full Kali KDE desktop (LinuxServer.io image). Ephemeral: auto-stops at 6h; cancel the run to stop sooner._"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Kali desktop link::${URL}  (user: kali  pass: ${WEBPASS})"
          echo "=================================================="
          echo " KALI DESKTOP : ${URL}"
          echo " LOGIN        : kali / ${WEBPASS}"
          echo "=================================================="

          # Hold the job open so the desktop stays reachable (under the 6h cap).
          END=$((SECONDS + 21000))
          while [ $SECONDS -lt $END ]; do
            if ! kill -0 "$CF_PID" 2>/dev/null; then echo "cloudflared exited:"; cat /tmp/cf.log; exit 1; fi
            sleep 10
          done
          echo "Reached time limit; shutting down."
